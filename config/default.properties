# Small, reproducible reference scenario. All durations are simulated seconds.
hosts=16
vms=32
duration=86400
sample=60
epoch=300
population=60
generations=50
seed=11
workload=medium
headroom=0.8
# Synthetic daily renewable peak in kW per zone; zone-specific multipliers in Scenario.java.
renewablePeakKw=0.08
# Minimum seconds since a VM's last completed move; headroom pressure overrides it.
cooldown=0

# Additive weighted ideal-distance allowance (weights 1,1,1.5) for shorter transfers.
selectionSlack=0.05
